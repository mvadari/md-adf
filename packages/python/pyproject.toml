[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adfmd"
version = "0.0.0"
description = "ADF-Markdown converter for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "ADF Markdown contributors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed"
]

[project.scripts]
adfmd = "adfmd_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adfmd", "src/adfmd_cli"]
