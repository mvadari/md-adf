[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "adfmd"
version = "0.0.0"
description = "ADF-Markdown converter for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "ADF Markdown contributors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed"
]

[project.scripts]
adfmd = "adfmd_cli.__main__:main"

[tool.poetry]
packages = [
  { include = "adfmd", from = "src" },
  { include = "adfmd_cli", from = "src" }
]

[tool.poetry.group.dev.dependencies]
mypy = ">=1.0"
pytest = ">=8.0"
ruff = ">=0.4"
