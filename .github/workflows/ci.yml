name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  POETRY_VERSION: "2.1.1"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Load cached .local
        id: cache-poetry
        uses: actions/cache@v5
        with:
          path: /home/runner/.local
          key: dotlocal-${{ env.POETRY_VERSION }}

      - name: Install Poetry
        if: steps.cache-poetry.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://install.python-poetry.org/ | python - --version ${{ env.POETRY_VERSION }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
          cache-dependency-path: packages/python/poetry.lock

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: poetry -C packages/python install --with dev

      - name: Lint JavaScript and Python
        run: npm run lint

  js-tests:
    name: JS tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate fixtures
        run: npm run validate:fixtures

      - name: Build JavaScript
        run: npm run build

      - name: Test JavaScript
        run: npm run test:js

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Load cached .local
        id: cache-poetry
        uses: actions/cache@v5
        with:
          path: /home/runner/.local
          key: dotlocal-${{ env.POETRY_VERSION }}

      - name: Install Poetry
        if: steps.cache-poetry.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://install.python-poetry.org/ | python - --version ${{ env.POETRY_VERSION }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
          cache-dependency-path: packages/python/poetry.lock

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: poetry -C packages/python install --with dev

      - name: Validate fixtures
        run: npm run validate:fixtures

      - name: Test Python
        run: npm run test:python

      - name: Build Python package
        run: poetry -C packages/python build

  conformance:
    name: Cross-language conformance
    runs-on: ubuntu-latest
    needs:
      - lint
      - js-tests
      - python-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Load cached .local
        id: cache-poetry
        uses: actions/cache@v5
        with:
          path: /home/runner/.local
          key: dotlocal-${{ env.POETRY_VERSION }}

      - name: Install Poetry
        if: steps.cache-poetry.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://install.python-poetry.org/ | python - --version ${{ env.POETRY_VERSION }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
          cache-dependency-path: packages/python/poetry.lock

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: poetry -C packages/python install --with dev

      - name: Run conformance summary
        run: npm run conformance
