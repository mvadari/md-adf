name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  POETRY_VERSION: "2.1.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: poetry
          cache-dependency-path: packages/python/poetry.lock

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: poetry -C packages/python install --with dev

      - name: Lint JavaScript and Python
        run: npm run lint

  js-tests:
    name: JS tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate fixtures
        run: npm run validate:fixtures

      - name: Build JavaScript
        run: npm run build

      - name: Test JavaScript
        run: npm run test:js

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: poetry
          cache-dependency-path: packages/python/poetry.lock

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: poetry -C packages/python install --with dev

      - name: Validate fixtures
        run: npm run validate:fixtures

      - name: Test Python
        run: npm run test:python

      - name: Build Python package
        run: poetry -C packages/python build

  conformance:
    name: Cross-language conformance
    runs-on: ubuntu-latest
    needs:
      - lint
      - js-tests
      - python-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: poetry
          cache-dependency-path: packages/python/poetry.lock

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: poetry -C packages/python install --with dev

      - name: Run conformance summary
        run: npm run conformance
